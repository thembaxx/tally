name: Verify app

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Oxlint
        run: npm run lint
      - name: Oxfmt
        run: npm run format:check
      - name: Production build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright on production build
        shell: bash
        run: |
          npm run start > /tmp/tally-next.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --silent --show-error --fail http://localhost:3000/ >/dev/null 2>&1; then
              npm test
              npm run test:mobile
              exit $?
            fi
            sleep 2
          done
          cat /tmp/tally-next.log
          exit 1
