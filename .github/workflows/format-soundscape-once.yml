# Temporary, branch-scoped formatter. Delete after the soundscape PR has been formatted.
name: Format soundscape branch

on:
  push:
    branches: [feat/sonic-feedback-20261023]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'thembaxx/tally'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply pinned Oxfmt
        run: npx oxfmt components/lesson-player.tsx components/studio-activities.tsx components/tally-app.tsx components/use-soundscape.ts tests/learning.spec.ts
      - name: Push formatted source on this branch only
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/lesson-player.tsx components/studio-activities.tsx components/tally-app.tsx components/use-soundscape.ts tests/learning.spec.ts
          git commit -m 'style: apply pinned oxfmt to soundscape changes'
          git push origin HEAD:feat/sonic-feedback-20261023
