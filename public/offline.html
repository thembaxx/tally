<!doctype html>
<html lang="en">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" /><meta
    name="theme-color"
    content="#f8f7f3"
  /><title>Tally — A little offline moment</title
  ><style>
    html {
      color-scheme: light dark;
    }
    body {
      background: #f8f7f3;

      font: 15px/1.8 system-ui;
      display: grid;
      place-items: center;
      min-height: 90vh;
      padding: 24px;
      text-align: center;
    }
    h1 {
      font-size: 32px;
      letter-spacing: -1px;
    }
    a {
      display: inline-block;
      color: #fff;
      background: #343d36;
      border-radius: 12px;
      padding: 12px 24px;
      text-decoration: none;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #181a1b;
        color: #eeeee5;
      }
    }
  </style>
  <main>
    <h1>A little offline moment.</h1>
    <p>

    <a href="/">Try again</a>
